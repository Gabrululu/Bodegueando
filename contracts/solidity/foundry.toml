[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "account-abstraction/=lib/account-abstraction/",
]

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
# Etherscan API v2 (una sola key de etherscan.io sirve para todas las chains); la API v1 de
# api-sepolia.arbiscan.io ya fue dada de baja. Sin `url`, Foundry usa v2 con el chain id.
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
